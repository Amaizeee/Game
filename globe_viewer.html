<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terre 3D • Satellites + Caméras</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(360px, calc(100vw - 32px));
        background: rgba(7, 12, 28, 0.82);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(100, 130, 255, 0.25);
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      h1 {
        font-size: 1rem;
        margin: 0 0 8px;
      }

      p,
      label,
      button,
      small {
        font-size: 0.85rem;
        line-height: 1.35;
        color: #d4dcff;
      }

      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }

      button {
        border: 1px solid rgba(120, 150, 255, 0.6);
        background: rgba(30, 47, 120, 0.5);
        color: #e7ecff;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
      }

      button:hover {
        background: rgba(48, 70, 168, 0.64);
      }

      input[type='range'] {
        width: 140px;
      }

      #status {
        margin-top: 8px;
        min-height: 20px;
        color: #a9d1ff;
      }

      a {
        color: #9dc2ff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <aside id="panel">
      <h1>🌍 Terre 3D interactive</h1>
      <p>
        Clique-glisse pour tourner, molette pour zoomer, clic droit pour déplacer la caméra.
      </p>

      <div class="row">
        <label for="speed">Vitesse temps (x)</label>
        <input id="speed" type="range" min="1" max="120" step="1" value="20" />
        <span id="speedValue">20</span>
      </div>

      <div class="row">
        <button id="toggleSat">Masquer satellites</button>
        <button id="toggleCam">Masquer caméras</button>
      </div>

      <div class="row">
        <button id="reload">Recharger données</button>
      </div>

      <small>
        Sources: CelesTrak (TLE) pour satellites, OpenStreetMap/Overpass pour caméras
        publiques (tag
        <code>man_made=surveillance</code>).
      </small>
      <div id="status">Initialisation…</div>
    </aside>

    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.166.1/build/three.module.js';
      import { OrbitControls } from 'https://unpkg.com/three@0.166.1/examples/jsm/controls/OrbitControls.js';
      import * as satellite from 'https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/+esm';

      const app = document.getElementById('app');
      const statusEl = document.getElementById('status');
      const speedInput = document.getElementById('speed');
      const speedValue = document.getElementById('speedValue');
      const toggleSatBtn = document.getElementById('toggleSat');
      const toggleCamBtn = document.getElementById('toggleCam');
      const reloadBtn = document.getElementById('reload');

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      app.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040812);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.position.set(0, 20, 34);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.minDistance = 12;
      controls.maxDistance = 200;

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const sun = new THREE.DirectionalLight(0xffffff, 1.1);
      sun.position.set(30, 10, 20);
      scene.add(sun);

      const starGeo = new THREE.BufferGeometry();
      const starCount = 6000;
      const starArr = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i += 1) {
        const r = 700 + Math.random() * 300;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        starArr[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        starArr[i * 3 + 1] = r * Math.cos(phi);
        starArr[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
      scene.add(
        new THREE.Points(
          starGeo,
          new THREE.PointsMaterial({ size: 1.1, color: 0xadc9ff, transparent: true, opacity: 0.75 })
        )
      );

      const earthRadius = 10;
      const earthGroup = new THREE.Group();
      scene.add(earthGroup);

      const textureLoader = new THREE.TextureLoader();
      const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-day.jpg');
      const bumpTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

      const earth = new THREE.Mesh(
        new THREE.SphereGeometry(earthRadius, 64, 64),
        new THREE.MeshPhongMaterial({ map: earthTexture, bumpMap: bumpTexture, bumpScale: 0.18, shininess: 3 })
      );
      earthGroup.add(earth);

      const clouds = new THREE.Mesh(
        new THREE.SphereGeometry(earthRadius * 1.008, 64, 64),
        new THREE.MeshPhongMaterial({
          map: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-clouds.png'),
          transparent: true,
          opacity: 0.36,
          depthWrite: false,
        })
      );
      earthGroup.add(clouds);

      const satellitesGroup = new THREE.Group();
      const camerasGroup = new THREE.Group();
      scene.add(satellitesGroup);
      scene.add(camerasGroup);

      const satPoints = new THREE.Points(
        new THREE.BufferGeometry(),
        new THREE.PointsMaterial({ color: 0xffb866, size: 0.24, sizeAttenuation: true })
      );
      satellitesGroup.add(satPoints);

      let satRecords = [];
      let satXYZ = new Float32Array(0);
      let satVisible = true;
      let camVisible = true;
      let timeScale = Number(speedInput.value);

      speedInput.addEventListener('input', () => {
        timeScale = Number(speedInput.value);
        speedValue.textContent = String(timeScale);
      });

      toggleSatBtn.addEventListener('click', () => {
        satVisible = !satVisible;
        satellitesGroup.visible = satVisible;
        toggleSatBtn.textContent = satVisible ? 'Masquer satellites' : 'Afficher satellites';
      });

      toggleCamBtn.addEventListener('click', () => {
        camVisible = !camVisible;
        camerasGroup.visible = camVisible;
        toggleCamBtn.textContent = camVisible ? 'Masquer caméras' : 'Afficher caméras';
      });

      const latLonToVec3 = (lat, lon, altitude = 0) => {
        const radius = earthRadius + altitude;
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);
        return new THREE.Vector3(
          -radius * Math.sin(phi) * Math.cos(theta),
          radius * Math.cos(phi),
          radius * Math.sin(phi) * Math.sin(theta)
        );
      };

      async function loadSatellites() {
        statusEl.textContent = 'Chargement satellites (CelesTrak)…';
        const url = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=json';
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Satellites HTTP ${response.status}`);
        const raw = await response.json();

        satRecords = raw
          .filter((d) => d.TLE_LINE1 && d.TLE_LINE2)
          .slice(0, 2500)
          .map((d) => ({
            name: d.OBJECT_NAME,
            satrec: satellite.twoline2satrec(d.TLE_LINE1, d.TLE_LINE2),
          }));

        satXYZ = new Float32Array(satRecords.length * 3);
        satPoints.geometry.dispose();
        satPoints.geometry = new THREE.BufferGeometry();
        satPoints.geometry.setAttribute('position', new THREE.BufferAttribute(satXYZ, 3));
      }

      function createCameraPoint(position) {
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.06, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0x4ed2ff })
        );
        mesh.position.copy(position);
        camerasGroup.add(mesh);
      }

      async function loadCameras() {
        statusEl.textContent = 'Chargement caméras (OpenStreetMap/Overpass)…';
        camerasGroup.clear();

        const query = `[out:json][timeout:40];\n(\n  node["man_made"="surveillance"](if:!is_tag("indoor"));\n);\nout body 700;`;

        const response = await fetch('https://overpass-api.de/api/interpreter', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          body: new URLSearchParams({ data: query }),
        });

        if (!response.ok) throw new Error(`Cameras HTTP ${response.status}`);
        const json = await response.json();
        (json.elements || []).forEach((el) => {
          if (typeof el.lat !== 'number' || typeof el.lon !== 'number') return;
          createCameraPoint(latLonToVec3(el.lat, el.lon, 0.08));
        });
      }

      function updateSatellites(date) {
        if (!satRecords.length) return;

        const gmst = satellite.gstime(date);
        let i = 0;
        for (const sat of satRecords) {
          const eci = satellite.propagate(sat.satrec, date).position;
          if (!eci) {
            satXYZ[i++] = 99999;
            satXYZ[i++] = 99999;
            satXYZ[i++] = 99999;
            continue;
          }
          const geodetic = satellite.eciToGeodetic(eci, gmst);
          const lat = satellite.degreesLat(geodetic.latitude);
          const lon = satellite.degreesLong(geodetic.longitude);
          const alt = Math.max(0, geodetic.height / 6371) * 4;

          const v = latLonToVec3(lat, lon, alt + 0.35);
          satXYZ[i++] = v.x;
          satXYZ[i++] = v.y;
          satXYZ[i++] = v.z;
        }

        satPoints.geometry.attributes.position.needsUpdate = true;
      }

      async function loadAllData() {
        try {
          await loadSatellites();
          await loadCameras();
          statusEl.textContent = `Satellites: ${satRecords.length} • Caméras: ${camerasGroup.children.length}`;
        } catch (error) {
          console.error(error);
          statusEl.textContent = `Erreur chargement: ${error.message}`;
        }
      }

      reloadBtn.addEventListener('click', loadAllData);

      const start = Date.now();
      function animate() {
        requestAnimationFrame(animate);

        const elapsedSeconds = (Date.now() - start) / 1000;
        const simulatedDate = new Date(Date.now() + elapsedSeconds * 1000 * (timeScale - 1));

        earth.rotation.y += 0.00045;
        clouds.rotation.y += 0.00056;
        updateSatellites(simulatedDate);

        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      loadAllData();
      animate();
    </script>
  </body>
</html>
